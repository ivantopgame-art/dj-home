<!DOCTYPE html>
<html>
<head>
    <title>Каталог телефонов</title>
</head>
<body>
    <h1>Каталог телефонов</h1>

    <div>
        <a href="?sort=name">По названию</a> |
        <a href="?sort=min_price">Сначала дешевые</a> |
        <a href="?sort=max_price">Сначала дорогие</a>
    </div>

    <div>
        {% for phone in phones %}
            <div style="border: 1px solid #ccc; margin: 10px; padding: 10px; display: inline-block;">
                <a href="{% url 'phone_detail' phone.slug %}">
                    <img src="{{ phone.image }}" alt="{{ phone.name }}" width="150">
                    <h3>{{ phone.name }}</h3>
                    <p>Цена: {{ phone.price }} ₽</p>
                </a>
            </div>
        {% endfor %}
    </div>
</body>
</html>
